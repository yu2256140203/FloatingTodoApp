name: Build Thesis Apps & FloatingTodo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # ======================== Thesis App Advanced ========================
    - name: Build Thesis App Advanced (High-end Version)
      run: |
        pyinstaller --noconsole --onefile `
          --name "ThesisChecker_Advanced" `
          --collect-all PyQt6 `
          --collect-all Qt6 `
          thesis_app_advanced.py

    # ======================== Thesis App Modern ========================
    - name: Build Thesis App Modern (Modern Version)
      run: |
        pyinstaller --noconsole --onefile `
          --name "ThesisChecker_Modern" `
          --collect-all PyQt6 `
          --collect-all Qt6 `
          thesis_app_modern.py

    # ======================== Thesis App Launcher ========================
    - name: Build Thesis Launcher
      run: |
        pyinstaller --noconsole --onefile `
          --name "ThesisChecker" `
          --collect-all PyQt6 `
          --collect-all Qt6 `
          run_thesis.py

    # ======================== FloatingTodo ========================
    - name: Build FloatingTodo
      run: |
        pyinstaller --noconsole --onefile --name "FloatingTodo" main.py

    # ======================== Original Thesis Checker ========================
    - name: Build Thesis Checker Classic
      run: |
        pyinstaller --noconsole --onefile `
          --name "ThesisChecker_Classic" `
          thesis_checker.py

    # ======================== Upload Artifacts ========================
    - name: Upload Thesis Checker Advanced
      uses: actions/upload-artifact@v4
      with:
        name: ThesisChecker-Advanced
        path: dist/ThesisChecker_Advanced.exe

    - name: Upload Thesis Checker Modern
      uses: actions/upload-artifact@v4
      with:
        name: ThesisChecker-Modern
        path: dist/ThesisChecker_Modern.exe

    - name: Upload Thesis Launcher
      uses: actions/upload-artifact@v4
      with:
        name: ThesisChecker-Launcher
        path: dist/ThesisChecker.exe

    - name: Upload FloatingTodo
      uses: actions/upload-artifact@v4
      with:
        name: FloatingTodo-Executable
        path: dist/FloatingTodo.exe

    - name: Upload Thesis Checker Classic
      uses: actions/upload-artifact@v4
      with:
        name: ThesisChecker-Classic
        path: dist/ThesisChecker_Classic.exe
