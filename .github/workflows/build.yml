name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build FloatingTodo
      run: |
        pyinstaller --noconsole --onefile --name "FloatingTodo" main.py

    - name: Build ThesisChecker
      run: |
        pyinstaller --noconsole --onefile --name "ThesisChecker" thesis_checker.py

    - name: Upload FloatingTodo
      uses: actions/upload-artifact@v4
      with:
        name: FloatingTodo-Executable
        path: dist/FloatingTodo.exe

    - name: Upload ThesisChecker
      uses: actions/upload-artifact@v4
      with:
        name: ThesisChecker-Executable
        path: dist/ThesisChecker.exe
